<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Bariadi Registration Portal</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="overlay"></div>

        <div class="header-content">

            <img
                src="assets/school.png"
                alt="Logo"
                class="logo"
            >

            <h1>
                BARIADI MKOBA REGISTRATION PORTAL
            </h1>
<p>
    
</p>
            <p>
                Please complete all required information carefully.
            </p>

        </div>

    </header>

    <!-- MAIN CONTAINER -->
    <main class="container">

        <!-- PROGRESS BAR -->
        <div class="progress-bar">
            <div class="progress"></div>
        </div>

        <!-- FORM -->
        <form id="registrationForm">

            <!-- SECTION A -->
            <section class="form-section">

                <h2>Personal Information</h2>

                <div class="grid">

                    <div class="input-group">
                        <label>Full Name *</label>

                        <input
                            type="text"
                            id="fullName"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label>Gender *</label>

                        <select
                            id="gender"
                            required
                        >
                            <option value="">
                                Select Gender
                            </option>

                            <option>Male</option>
                            <option>Female</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Date of Birth *</label>

                        <input
                            type="date"
                            id="dob"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label>Marital Status</label>

                        <select id="maritalStatus">

                            <option value="">
                                Select Status
                            </option>

                            <option>Single</option>
                            <option>Married</option>
                            <option>Divorced</option>
                            <option>Widowed</option>

                        </select>
                    </div>

                    <div class="input-group">
                        <label>Nationality</label>

                        <input
                            type="text"
                            id="nationality"
                        >
                    </div>

                    <div class="input-group">
                        <label>Occupation</label>

                        <input
                            type="text"
                            id="occupation"
                        >
                    </div>

                    <div class="input-group">
                        <label>Phone Number *</label>

                        <input
                            type="tel"
                            id="phone"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label>Email Address *</label>

                        <input
                            type="email"
                            id="email"
                            required
                        >
                    </div>

                </div>

                <div class="input-group full-width">

                    <label>
                        Physical Address
                    </label>

                    <textarea
                        rows="4"
                        id="address"
                    ></textarea>

                </div>

            </section>

            <!-- PROFILE PHOTO -->
            <section class="form-section">

                <h2>Profile Picture</h2>

                <div class="photo-upload">

                    <img
                        src="https://via.placeholder.com/150"
                        id="photoPreview"
                        class="photo-preview"
                        alt="Preview"
                    >

                    <input
                        type="file"
                        id="profilePhoto"
                        accept="image/*"
                    >

                </div>

            </section>

            <!-- FAMILY INFORMATION -->
            <section class="form-section">

                <h2>Family Information</h2>

                <div class="grid">

                    <div class="input-group">

                        <label>
                            Spouse Name
                        </label>

                        <input
                            type="text"
                            id="spouseName"
                        >

                    </div>

                    <div class="input-group">

                        <label>
                            Number of Children
                        </label>

                        <input
                            type="number"
                            id="children"
                            min="0"
                        >

                    </div>

                </div>

                <!-- DYNAMIC FAMILY MEMBERS -->
                <div id="familyMembersContainer">

                </div>

                <button
                    type="button"
                    id="addFamilyBtn"
                    class="add-btn"
                >
                    + Add Family Member
                </button>

            </section>

            <!-- EMERGENCY CONTACT -->
            <section class="form-section">

                <h2>Emergency Contact</h2>

                <div class="grid">

                    <div class="input-group">

                        <label>
                            Emergency Contact Name
                        </label>

                        <input
                            type="text"
                            id="emergencyContact"
                        >

                    </div>

                    <div class="input-group">

                        <label>
                            Relationship
                        </label>

                        <input
                            type="text"
                            id="emergencyRelationship"
                        >

                    </div>

                    <div class="input-group">

                        <label>
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="emergencyPhone"
                        >

                    </div>

                </div>

                <div class="input-group full-width">

                    <label>
                        Address
                    </label>

                    <textarea
                        rows="3"
                        id="emergencyAddress"
                    ></textarea>

                </div>

            </section>

            <!-- GROUP PARTICIPATION -->
            <section class="form-section">

                <h2>Group Participation</h2>

                <div class="input-group full-width">

                    <label>
                        Why do you want to join this community group?
                    </label>

                    <textarea
                        rows="5"
                        id="reason"
                    ></textarea>

                </div>

                <div class="skills">

                    <label class="checkbox">

                        <input
                            type="checkbox"
                            value="Leadership"
                        >

                        Leadership

                    </label>

                    <label class="checkbox">

                        <input
                            type="checkbox"
                            value="Counseling"
                        >

                        Counseling

                    </label>

                    <label class="checkbox">

                        <input
                            type="checkbox"
                            value="Teaching"
                        >

                        Teaching

                    </label>

                    <label class="checkbox">

                        <input
                            type="checkbox"
                            value="Financial Support"
                        >

                        Financial Support

                    </label>

                    <label class="checkbox">

                        <input
                            type="checkbox"
                            value="Volunteering"
                        >

                        Volunteering

                    </label>

                    <label class="checkbox">

                        <input
                            type="checkbox"
                            value="Event Organization"
                        >

                        Event Organization

                    </label>

                </div>

            </section>

            <!-- DECLARATION -->
            <section class="form-section">

                <h2>Declaration</h2>

                <label class="checkbox declaration">

                    <input
                        type="checkbox"
                        id="declaration"
                        required
                    >

                    I confirm that all information provided is correct.

                </label>

                <button
                    type="submit"
                    class="submit-btn"
                >
                    Submit Registration
                </button>

            </section>

        </form>

    </main>

    <!-- JS -->
    <script src="script.js"></script>

</body>

</html>
